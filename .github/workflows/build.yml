name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout forgematica-port
        uses: actions/checkout@v4

      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      # MaFgLib (required library) for 26.3, built from the CagayakeGirls source
      - name: checkout MaFgLib 26.3
        uses: actions/checkout@v4
        with:
          repository: CagayakeGirls/malilib-neoforge
          ref: c4a6e202c22e25f386e94d2adfd3b090a288be31
          path: mafglib

      - name: build MaFgLib and install to local maven
        working-directory: mafglib
        run: |
          chmod +x ./gradlew
          ./gradlew build publishToMavenLocal --stacktrace

      - name: build Forgematica
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: collect jars
        run: |
          mkdir -p out
          cp build/libs/*.jar out/
          cp mafglib/build/libs/*.jar out/
          rm -f out/*-sources.jar out/*-dev*.jar
          ls -la out

      - name: upload jars
        uses: actions/upload-artifact@v4
        with:
          name: forgematica-26.3-jars
          path: out/

      - name: publish build log on failure
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp build.log /tmp/logs/ 2>/dev/null || true
          cp mafglib/build.log /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "build log ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

      - name: publish jars to release-jars branch and GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/rel && cp -r out /tmp/rel && cd /tmp/rel
          git init -q -b release-jars
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "jars ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" release-jars
          cd "$GITHUB_WORKSPACE"
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/*.jar --title "Forgematica 26.3 (NeoForge)" --notes "Forgematica + MaFgLib fuer Minecraft 26.3 NeoForge. Beide Jars ins CurseForge-Profil ziehen." --target "$GITHUB_SHA"
